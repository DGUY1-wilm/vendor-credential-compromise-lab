title: Service Account Granted Admin Rights at Logon
id: 9af7aa5c-7b9c-4033-800f-e50b52083e35
status: experimental
description: >
    A service account (svc-*) receiving special privileges (4672) or logging on
    interactively/over WinRM. Service accounts should run services, not log in
    like people. Catches Phase 2 step 4 (svc-backup used for lateral movement).
references:
    - https://attack.mitre.org/techniques/T1078/002/
author: Daniel Guy
date: 2026/10/27
logsource:
    product: windows
    service: security
detection:
    special_privs:
        EventID: 4672
        SubjectUserName|startswith: 'svc-'
    interactive:
        EventID: 4624
        TargetUserName|startswith: 'svc-'
        LogonType:
            - 2    # interactive
            - 10   # remote interactive / RDP
    condition: 1 of them
falsepositives:
    - A service account legitimately configured for an interactive maintenance task
level: medium
tags:
    - attack.lateral_movement
    - attack.t1078.002
