title: Remote Service Install Consistent with Credential Dumping
id: 5ecfffac-a820-4229-a381-09bff3931f1d
status: experimental
description: >
    Detects the transient service Impacket secretsdump/psexec installs to run
    commands remotely - a service whose image path launches cmd/powershell or
    writes to a named pipe. Catches Phase 2 step 4 (secretsdump on fs01).
references:
    - https://attack.mitre.org/techniques/T1003/
author: Daniel Guy
date: 2026/10/27
logsource:
    product: windows
    service: system
detection:
    selection:
        EventID: 7045
    suspicious_path:
        ImagePath|contains:
            - 'cmd.exe /C'
            - 'cmd.exe /c'
            - '%COMSPEC%'
            - 'powershell'
            - '\\127.0.0.1\ADMIN$'
            - '\\.\pipe\'
    condition: selection and suspicious_path
falsepositives:
    - Some legitimate software installs services with scripted image paths
level: high
tags:
    - attack.credential_access
    - attack.t1003.001
    - attack.t1003.002
